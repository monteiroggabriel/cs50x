<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Part 1: Multiple Choice
                const mcButtons = document.querySelectorAll('.btn-mc');
                const mcFeedback = document.querySelector('#feedback-mc');

                mcButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        // Reset styling of all buttons in Part 1
                        mcButtons.forEach(btn => {
                            btn.style.backgroundColor = '#d9edff';
                            btn.style.color = '#212529';
                        });

                        // Check answer and change button style/feedback text
                        if (button.textContent.trim() === 'Shrek 2') {
                            button.style.backgroundColor = '#28a745'; // green
                            button.style.color = '#ffffff';
                            mcFeedback.textContent = 'Correct!';
                            mcFeedback.style.color = '#28a745';
                        } else {
                            button.style.backgroundColor = '#dc3545'; // red
                            button.style.color = '#ffffff';
                            mcFeedback.textContent = 'Incorrect';
                            mcFeedback.style.color = '#dc3545';
                        }
                    });
                });

                // Part 2: Free Response
                const frInput = document.querySelector('#input-fr');
                const frButton = document.querySelector('#btn-fr');
                const frFeedback = document.querySelector('#feedback-fr');

                function checkFreeResponse() {
                    const answer = frInput.value.trim();

                    // Correct answer is "Gabriel" (case-insensitive)
                    if (answer.toLowerCase() === 'gabriel') {
                        frInput.style.backgroundColor = '#28a745'; // green
                        frInput.style.color = '#ffffff';
                        frFeedback.textContent = 'Correct!';
                        frFeedback.style.color = '#28a745';
                    } else {
                        frInput.style.backgroundColor = '#dc3545'; // red
                        frInput.style.color = '#ffffff';
                        frFeedback.textContent = 'Incorrect';
                        frFeedback.style.color = '#dc3545';
                    }
                }

                frButton.addEventListener('click', checkFreeResponse);
                
                // Allow confirming answer with the Enter key
                frInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        checkFreeResponse();
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the best movie of all time?</h3>
                <div class="options-container" style="margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn-mc">Shrek</button>
                    <button class="btn-mc">Shrek 2</button>
                    <button class="btn-mc">Shrek the Third</button>
                    <button class="btn-mc">Shrek Forever After</button>
                </div>
                <p id="feedback-mc" style="font-weight: bold; font-size: 1.1rem; margin-top: 0.5rem; min-height: 1.5rem;"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>Who is the best programmer in the world?</h3>
                <div class="free-response-container" style="margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center;">
                    <input type="text" id="input-fr" placeholder="Your answer..." style="padding: 0.375rem 0.75rem; border: 1px solid #ced4da; border-radius: 0.25rem; font-size: 0.95rem; width: 30%; transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out, border-color 0.15s ease-in-out;">
                    <button id="btn-fr">Confirm</button>
                </div>
                <p id="feedback-fr" style="font-weight: bold; font-size: 1.1rem; margin-top: 0.5rem; min-height: 1.5rem;"></p>
            </div>
        </div>
    </body>
</html>
